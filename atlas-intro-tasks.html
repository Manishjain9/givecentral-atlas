<style>
  :root{
    --navy:#0E1E35;
    --navy-deep:#060e1c;
    --gold:#C8A04A;
    --gold-soft:rgba(200,160,74,.55);
    --gold-faint:rgba(200,160,74,.18);
    --text:#F1F5F9;
    --text-dim:#94A3B8;
    --serif:'DM Serif Display', Georgia, serif;
    --sans:'DM Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--sans)}

  .stage-wrap{
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  .stage{
    position:relative;
    width:1920px;height:1080px;
    background:
      radial-gradient(ellipse at 50% 50%, #15264a 0%, var(--navy) 38%, var(--navy-deep) 100%);
    overflow:hidden;
    transform-origin:center center;
    transform:scale(min(calc(100vw / 1920), calc(100vh / 1080)));
  }
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  .starfield{position:absolute;inset:0;pointer-events:none}
  .starfield circle{fill:rgba(255,255,255,.4)}

  .corner-glyph{position:absolute;width:280px;height:280px;opacity:.35}
  .corner-tl{top:60px;left:60px}
  .corner-br{bottom:60px;right:60px;transform:rotate(180deg)}

  .frame{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;
  }

  .eyebrow-top{
    display:flex;align-items:center;gap:24px;
    margin-bottom:56px;
    opacity:0;animation:fadeIn .9s ease-out .2s forwards;
  }
  .eyebrow-top .ln{height:1px;width:80px;background:linear-gradient(90deg, transparent, var(--gold-soft), transparent)}
  .eyebrow-top .lbl{
    font-family:var(--sans);font-size:13px;font-weight:600;
    color:var(--gold);letter-spacing:.42em;text-transform:uppercase;
  }

  .logo-mark{
    width:280px;height:210px;
    opacity:0;animation:fadeIn 1.1s ease-out .55s forwards;
    filter:drop-shadow(0 0 24px rgba(200,160,74,.18));
  }
  .logo-mark .star-pulse{
    animation:pulse 3.2s ease-in-out 1.6s infinite;
    transform-origin:138px 24px;
    transform-box:fill-box;
  }

  .wordmark{
    font-family:var(--serif);
    font-size:148px;
    color:var(--text);
    line-height:1;
    letter-spacing:-.02em;
    margin-top:36px;
    opacity:0;animation:fadeUp 1s ease-out .9s forwards;
  }

  .divider{
    width:200px;height:2px;
    background:linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    margin:42px 0 36px;
    transform:scaleX(0);
    transform-origin:center;
    animation:drawIn 1s ease-out 1.3s forwards;
  }

  .screen-title{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:78px;
    color:var(--gold);
    line-height:1;
    letter-spacing:-.01em;
    opacity:0;animation:fadeUp 1s ease-out 1.55s forwards;
  }

  .kicker{
    position:absolute;
    bottom:96px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;
    opacity:0;animation:fadeIn 1s ease-out 1.95s forwards;
  }
  .kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .kicker .lbl{
    font-family:var(--sans);font-size:13px;font-weight:600;
    color:var(--text-dim);letter-spacing:.5em;text-transform:uppercase;
  }

  .brand-chip{
    position:absolute;top:60px;left:80px;
    display:flex;align-items:center;gap:12px;
    opacity:0;animation:fadeIn .9s ease-out .1s forwards;
  }
  .brand-chip svg{width:32px;height:24px}
  .brand-chip .lbl{
    font-family:var(--sans);font-size:11px;font-weight:600;
    color:var(--text-dim);letter-spacing:.32em;text-transform:uppercase;
  }

  .slate-stamp{
    position:absolute;top:60px;right:80px;
    display:flex;align-items:center;gap:10px;
    opacity:0;animation:fadeIn .9s ease-out .1s forwards;
  }
  .slate-stamp .num{font-family:var(--serif);font-size:22px;color:var(--gold)}
  .slate-stamp .lbl{
    font-family:var(--sans);font-size:11px;font-weight:600;
    color:var(--text-dim);letter-spacing:.32em;text-transform:uppercase;
  }

  @keyframes fadeIn{to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes drawIn{to{transform:scaleX(1)}}
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.55;transform:scale(1.18)}
  }
  @keyframes twinkle{
    0%,100%{opacity:.18}
    50%{opacity:.85}
  }
  .starfield circle:nth-child(3n){animation:twinkle 4s ease-in-out infinite}
  .starfield circle:nth-child(5n){animation:twinkle 5.5s ease-in-out infinite 1s}
  .starfield circle:nth-child(7n){animation:twinkle 6.5s ease-in-out infinite .5s}

</style>

<!-- ════ Atlas-themed dialog (replaces native alert/confirm) — auto-injected ════ -->
<style>
  #ax-ov{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:2147483000;display:none;align-items:center;justify-content:center;padding:24px;font-family:'DM Sans',-apple-system,sans-serif}
  #ax-ov.show{display:flex}
  #ax-ov .ax-box{background:#fff;border-radius:16px;width:100%;max-width:430px;box-shadow:0 24px 64px rgba(15,23,42,.30);overflow:hidden;animation:axUp .18s ease}
  @keyframes axUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #ax-ov .ax-bd{display:flex;gap:14px;padding:22px 22px 8px}

  #ax-ov .ax-ghost{background:#fff;border-color:#E2E8F0;color:#334155}

  #ax-ov .ax-primary:hover{background:#1D4ED8}
  #ax-ov .ax-danger{background:#BE185D;color:#fff}
  #ax-ov .ax-danger:hover{background:#9D174D}
  #ax-ov .ax-gold{background:#B45309;color:#fff}
  #ax-ov .ax-gold:hover{background:#92400E}
</style>
<div id="ax-ov"><div class="ax-box">
  <div class="ax-bd"><div class="ax-ic" id="ax-ic"></div><div><h3 class="ax-tt" id="ax-tt"></h3><p class="ax-msg" id="ax-msg"></p></div></div>
  <div class="ax-ft" id="ax-ft"></div>
</div></div>
<script>
(function(){
  if(window.__axInit) return; window.__axInit=true;
  var ICONS={
    danger:['#FCE7F3','#BE185D','<path d="M2.5 4.5h16v3.5h-16zM4 8v9.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V8M8 11.5h5"/>'],
    warn:['#FEF3C7','#D97706','<path d="M10 7.5v4M10 14.3v.2"/><path d="M8.6 3.4 2.6 14a1.6 1.6 0 0 0 1.4 2.4h12A1.6 1.6 0 0 0 17.4 14L11.4 3.4a1.6 1.6 0 0 0-2.8 0Z"/>'],
    info:['#EFF6FF','#2563EB','<circle cx="10" cy="10" r="7.5"/><path d="M10 9.3v4.2M10 6.4v.2"/>'],
    success:['#DCFCE7','#15803D','<circle cx="10" cy="10" r="7.5"/><path d="M6.5 10.2l2.2 2.2 4.8-4.8"/>'],
    docusign:['#FBF4E8','#B45309','<rect x="3" y="2.5" width="14" height="15" rx="2"/><path d="M6 7h8M6 10h5M6 13l1.4 1.4L10.5 11.3"/>']
  };
  function el(id){ return document.getElementById(id); }
  function close(){ var o=el('ax-ov'); if(o) o.classList.remove('show'); }
  window.axClose=close;
  function dialog(o){
    var ov=el('ax-ov'); if(!ov) return; var ic=ICONS[o.icon]||ICONS[o.danger?'danger':'info'];
    el('ax-ic').style.background=ic[0]; el('ax-ic').style.color=ic[1];
    el('ax-ic').innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+ic[2]+'</svg>';
    el('ax-tt').textContent=o.title||''; el('ax-tt').style.display=o.title?'':'none'; el('ax-msg').innerHTML=o.message||'';
    var ft=el('ax-ft'); ft.innerHTML='';
    if(!o.alert){ var c=document.createElement('button'); c.className='ax-btn ax-ghost'; c.textContent=o.cancelText||'Cancel'; c.onclick=function(){ close(); if(o.onCancel)o.onCancel(); }; ft.appendChild(c); }
    var ok=document.createElement('button'); ok.className='ax-btn '+(o.btn==='gold'?'ax-gold':(o.danger?'ax-danger':'ax-primary')); ok.textContent=o.confirmText||(o.alert?'Got it':'OK');
    ok.onclick=function(){ close(); if(o.onConfirm)o.onConfirm(); }; ft.appendChild(ok);
    ov.classList.add('show'); setTimeout(function(){ try{ok.focus();}catch(e){} },40);
  }
  window.atlasConfirm=function(o){ dialog(o||{}); };
  window.atlasAlert=function(title,message,o){ o=o||{}; dialog({title:title,message:message,alert:true,icon:o.icon||'info',btn:o.btn,confirmText:o.confirmText||'Got it',onConfirm:o.onConfirm}); };
  // theme all native alert() calls automatically
  window.alert=function(m){ atlasAlert('Atlas', String(m==null?'':m)); };
  var ov=el('ax-ov'); if(ov) ov.addEventListener('click',function(e){ if(e.target===this) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
})();
</script>

<script id="atlas-datepicker-js">
(function(){
  if (window.__atlasDP) return; window.__atlasDP = true;
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var DATE_PH=/\b(m{1,2}\s*[\/\-.]\s*d{1,2}\s*[\/\-.]\s*y{2,4}|y{4}\s*[\/\-.]\s*m{1,2}\s*[\/\-.]\s*d{1,2}|d{1,2}\s*[\/\-.]\s*m{1,2}\s*[\/\-.]\s*y{2,4})\b/i;
  var WORD_DATE=/\bdate\b/i;

  function looksDate(inp){
    if(!inp||inp.tagName!=='INPUT') return false;
    var t=(inp.getAttribute('type')||'text').toLowerCase();
    if(t!=='text'&&t!=='') return false;              // leave native date/other inputs alone
    if(inp.getAttribute('data-adp')==='off') return false;
    if(inp.getAttribute('list')) return false;         // autocomplete fields
    var ph=inp.getAttribute('placeholder')||'';
    if(DATE_PH.test(ph)) return true;
    if(WORD_DATE.test(ph)) return true;
    // label / aria signal (whole word "date")
    var lab=inp.getAttribute('aria-label')||'';
    if(WORD_DATE.test(lab)) return true;
    // native label association (for=/wrapping label)
    try{ if(inp.labels){ for(var i=0;i<inp.labels.length;i++){ if(WORD_DATE.test(inp.labels[i].textContent||'')) return true; } } }catch(e){}
    var isLbl=function(el){ return el && el.matches && el.matches('label,.lbl,.field-label,.form-label'); };
    // immediate preceding sibling labels (no climbing to broad ancestors)
    var sib=inp.previousElementSibling, guard=0;
    while(sib && guard<3){ if(isLbl(sib) && WORD_DATE.test(sib.textContent||'')) return true; sib=sib.previousElementSibling; guard++; }
    // direct label children of the input's own wrapper only
    var par=inp.parentElement;
    if(par){ var kids=par.children; for(var j=0;j<kids.length;j++){ var k=kids[j]; if(k!==inp && isLbl(k) && WORD_DATE.test(k.textContent||'')) return true; } }
    return false;
  }

  // ---- format detection & output ----
  function fmtOf(inp){
    var ph=(inp.getAttribute('placeholder')||'').toLowerCase();
    var v=(inp.value||'').trim();
    if(/y{4}\s*[\/\-.]\s*m/.test(ph)||/^\d{4}-\d{1,2}-\d{1,2}$/.test(v)) return 'iso';
    if(/d{1,2}\s*[\/\-.]\s*m/.test(ph)) return 'dmy';
    if(/[a-z]{3,}\s+\d{1,2},?\s+\d{4}/i.test(v)) return 'long';
    return 'mdy';
  }
  function pad(n){return (n<10?'0':'')+n;}
  function toStr(d,fmt){
    var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
    if(fmt==='iso') return y+'-'+pad(m)+'-'+pad(day);
    if(fmt==='dmy') return pad(day)+'/'+pad(m)+'/'+y;
    if(fmt==='long') return MON[m-1]+' '+day+', '+y;
    return pad(m)+'/'+pad(day)+'/'+y;
  }
  function parse(v){
    v=(v||'').trim(); if(!v) return null;
    var m;
    if(m=v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/)) return new Date(+m[1],+m[2]-1,+m[3]);
    if(m=v.match(/^([a-z]{3,})\s+(\d{1,2}),?\s+(\d{4})$/i)){var mi=MON.findIndex(function(x){return x.toLowerCase().indexOf(m[1].toLowerCase())===0;});if(mi>=0)return new Date(+m[3],mi,+m[2]);}
    if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){var y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2]);}
    var d=new Date(v); return isNaN(d)?null:d;
  }

  // ---- single shared popover ----
  var pop,active,view,mode='days';
  function build(){
    pop=document.createElement('div');pop.className='adp-pop';pop.setAttribute('role','dialog');
    document.body.appendChild(pop);
    pop.addEventListener('mousedown',function(e){e.preventDefault();}); // keep field focus
  }
  function close(){ if(pop) pop.classList.remove('open'); active=null; mode='days'; }
  function open(inp){
    if(!pop) build();
    active=inp; mode='days';
    view=parse(inp.value)||new Date();
    render(); position(); pop.classList.add('open');
  }
  function position(){
    var r=active.getBoundingClientRect(), sx=window.pageXOffset, sy=window.pageYOffset;
    pop.style.visibility='hidden'; pop.classList.add('open');
    var ph=pop.offsetHeight, pw=pop.offsetWidth;
    pop.classList.remove('open'); pop.style.visibility='';
    var top=r.bottom+sy+6, left=r.left+sx;
    if(r.bottom+ph+6>window.innerHeight && r.top-ph-6>0) top=r.top+sy-ph-6;
    left=Math.min(left, sx+window.innerWidth-pw-8); left=Math.max(left,sx+8);
    pop.style.top=top+'px'; pop.style.left=left+'px';
  }
  function commit(d){
    var fmt=fmtOf(active);
    active.value=toStr(d,fmt);
    active.dispatchEvent(new Event('input',{bubbles:true}));
    active.dispatchEvent(new Event('change',{bubbles:true}));
    close();
  }
  function render(){
    if(mode==='months'){renderMonths();return;}
    if(mode==='years'){renderYears();return;}
    var y=view.getFullYear(), mo=view.getMonth();
    var sel=parse(active.value), today=new Date();
    var first=new Date(y,mo,1), start=first.getDay(), dim=new Date(y,mo+1,0).getDate(), pdim=new Date(y,mo,0).getDate();
    var h='<div class="adp-hd"><button class="adp-nav" data-a="pm">&#8249;</button>'+
      '<div class="adp-title" data-a="mode">'+MON[mo]+' '+y+'</div>'+
      '<button class="adp-nav" data-a="nm">&#8250;</button></div><div class="adp-grid">';
    for(var i=0;i<7;i++) h+='<div class="adp-dow">'+DOW[i]+'</div>';
    for(var c=0;c<42;c++){
      var dn,cls='adp-day',dt;
      if(c<start){dn=pdim-start+1+c;cls+=' mut';dt=new Date(y,mo-1,dn);}
      else if(c-start+1<=dim){dn=c-start+1;dt=new Date(y,mo,dn);}
      else{dn=c-start+1-dim;cls+=' mut';dt=new Date(y,mo+1,dn);}
      if(dt.getFullYear()===today.getFullYear()&&dt.getMonth()===today.getMonth()&&dt.getDate()===today.getDate())cls+=' today';
      if(sel&&dt.getFullYear()===sel.getFullYear()&&dt.getMonth()===sel.getMonth()&&dt.getDate()===sel.getDate())cls+=' sel';
      h+='<button class="'+cls+'" data-d="'+dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate()+'">'+dn+'</button>';
      if(c>=start+dim-1 && (c+1)%7===0) break;
    }
    h+='</div><div class="adp-ft"><button class="adp-today-b" data-a="today">Today</button><button class="adp-clear-b" data-a="clear">Clear</button></div>';
    pop.innerHTML=h;
  }
  function renderMonths(){
    var y=view.getFullYear();
    var h='<div class="adp-hd"><button class="adp-nav" data-a="py">&#8249;</button>'+
      '<div class="adp-title" data-a="years">'+y+'</div><button class="adp-nav" data-a="ny">&#8250;</button></div><div class="adp-mgrid">';
    for(var i=0;i<12;i++) h+='<button class="adp-cell'+(i===view.getMonth()?' sel':'')+'" data-m="'+i+'">'+MONS[i]+'</button>';
    h+='</div>'; pop.innerHTML=h;
  }
  function renderYears(){
    var base=view.getFullYear()-6;
    var h='<div class="adp-hd"><button class="adp-nav" data-a="pyr">&#8249;</button>'+
      '<div class="adp-title">'+base+' – '+(base+11)+'</div><button class="adp-nav" data-a="nyr">&#8250;</button></div><div class="adp-mgrid">';
    for(var i=0;i<12;i++){var yr=base+i;h+='<button class="adp-cell'+(yr===view.getFullYear()?' sel':'')+'" data-y="'+yr+'">'+yr+'</button>';}
    h+='</div>'; pop.innerHTML=h;
  }

  document.addEventListener('click',function(e){
    if(!pop) return;
    var t=e.target;
    if(pop.contains(t)){
      var a=t.getAttribute('data-a'), d=t.getAttribute('data-d'), mm=t.getAttribute('data-m'), yy=t.getAttribute('data-y');
      if(d){var p=d.split('-');commit(new Date(+p[0],+p[1]-1,+p[2]));return;}
      if(mm!=null){view=new Date(view.getFullYear(),+mm,1);mode='days';render();return;}
      if(yy!=null){view=new Date(+yy,view.getMonth(),1);mode='months';render();return;}
      if(a==='pm'){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();}
      else if(a==='nm'){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();}
      else if(a==='mode'){mode='months';render();}
      else if(a==='years'){mode='years';render();}
      else if(a==='py'){view=new Date(view.getFullYear()-1,view.getMonth(),1);render();}
      else if(a==='ny'){view=new Date(view.getFullYear()+1,view.getMonth(),1);render();}
      else if(a==='pyr'){view=new Date(view.getFullYear()-12,view.getMonth(),1);render();}
      else if(a==='nyr'){view=new Date(view.getFullYear()+12,view.getMonth(),1);render();}
      else if(a==='today'){commit(new Date());}
      else if(a==='clear'){active.value='';active.dispatchEvent(new Event('input',{bubbles:true}));active.dispatchEvent(new Event('change',{bubbles:true}));close();}
      return;
    }
    if(active && t===active) return;
    close();
  },true);

  document.addEventListener('focusin',function(e){ if(looksDate(e.target)) open(e.target); });
  document.addEventListener('click',function(e){ if(looksDate(e.target) && active!==e.target) open(e.target); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  window.addEventListener('resize',function(){ if(active&&pop&&pop.classList.contains('open')) position(); });
  window.addEventListener('scroll',function(){ if(active&&pop&&pop.classList.contains('open')) position(); },true);

  window.__atlasLooksDate=looksDate; // exposed for tests
})();
</script>
<!-- /ATLAS-DATEPICKER -->
</body>
