<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1E35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Atlas Mobile — Hi-Fi Prototype (Phase 0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1E35; --navy-2:#16294a; --navy-card:#132441;
  --blue:#2563EB; --blue-2:#1D4ED8; --blue-pale:#EFF4FF; --blue-mid:#BFD3FF;
  --green:#15803D; --green-l:#DCFCE7; --amber:#B45309; --amber-l:#FEF3C7;
  --rose:#BE185D; --rose-l:#FCE7F3; --purp:#7C3AED; --purp-l:#F3E8FF; --teal:#0D9488; --teal-l:#CCFBF1;
  --gold:#C8A04A; --mint:#34D399;
  --text:#0F172A; --text2:#334155; --text3:#64748B; --text4:#94A3B8;
  --border:#E5EAF1; --border2:#EEF2F7; --surface:#F6F8FB; --surface2:#F1F5F9; --white:#fff;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 12px 34px rgba(15,23,42,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0b1220;color:var(--text);min-height:100vh;
  background-image:radial-gradient(1200px 600px at 20% -10%,#182740 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#101b30 0,transparent 55%);}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}

/* ===== Stage / controls ===== */
.stage{max-width:1280px;margin:0 auto;padding:26px 24px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,#132441,#0b1626);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:#93a4bd;font-weight:500;margin-top:1px}
.seg{display:inline-flex;background:#0e1a2e;border:1px solid #22344f;border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:#9fb0c9;font:600 13px 'DM Sans';padding:8px 15px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.seg button.on{background:var(--blue);color:#fff;box-shadow:var(--shadow-md)}
.seg.small button{padding:7px 13px;font-size:12.5px}
.controls-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 26px}
.screen-tabs{display:flex;gap:8px;flex-wrap:wrap}
.screen-tabs button{border:1px solid #24374f;background:#0e1a2e;color:#aebbcf;font:600 12.5px 'DM Sans';padding:8px 14px;border-radius:20px;cursor:pointer;transition:.15s}
.screen-tabs button.on{background:#fff;color:var(--navy);border-color:#fff}
.hint{color:#7f90aa;font-size:12.5px}

.frames{display:flex;gap:46px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.device-label{color:#8ea0ba;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* ===== Device frame ===== */
.viewport{position:relative;width:100%;height:100%;background:var(--surface);border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
body.android .viewport{border-radius:30px}

/* status bar */
.statusbar{height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;color:var(--text);position:relative;z-index:5}
.statusbar.on-dark{color:#fff}
.statusbar .time{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:33px;background:#000;border-radius:20px;z-index:6}
body.android .island{display:none}
body.android .statusbar{height:34px;padding:0 18px;font-size:13px}
.a-dot{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#000;display:none;z-index:6}
body.android .a-dot{display:block}

/* scroll body */
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.body::-webkit-scrollbar{width:0}

/* bottom chrome */
.tabbar{flex:0 0 auto;height:76px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding:8px 6px 0;position:relative;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text4);cursor:pointer;padding-top:6px}
.tab.on{color:var(--blue)}
.tab .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.tab span{font-size:10.5px;font-weight:600}
body.android .tabbar{height:66px;background:#fff}
body.android .tab .ic{width:56px;height:30px;border-radius:16px;transition:.15s}
body.android .tab.on .ic{background:var(--blue-pale)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:3px;background:#0f172a;opacity:.85;z-index:7}
body.android .home-ind{width:110px;height:4px;opacity:.5}
.tabbar-pad{height:22px;flex:0 0 auto;background:inherit}

/* ===== generic mobile components ===== */
.appbar{padding:8px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.appbar h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
body.android .appbar h2{font-size:22px}
.appbar .count{font-size:13px;color:var(--text3);font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text3)}
.search{margin:4px 20px 14px;height:44px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--text4);font-size:15px;box-shadow:var(--shadow-sm)}
body.android .search{border-radius:26px;background:var(--surface2);border-color:transparent}

.list{padding:0 16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
body.android .row{border-radius:14px}
.row .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#e9eef6,#dfe7f2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text3);flex:0 0 auto}
.row .main{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:600;color:var(--text)}
.row .meta{font-size:12.5px;color:var(--text3);margin-top:2px}
.row .chev{color:var(--text4);font-size:18px}
.donor-row{align-items:center}
.donor-row .main{min-width:0}
.donor-row .dr-top{display:flex;align-items:center;gap:8px;min-width:0}
.donor-row .dr-top .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donor-row .dr-tag{flex:0 0 auto;font-size:10px;padding:2px 8px;border-radius:7px}
.donor-row .dr-addr{display:flex;align-items:center;gap:4px;margin-top:3px}
.donor-row .dr-rgt{flex:0 0 auto;text-align:right;padding-left:6px}
.donor-row .dr-life{font-weight:700;font-size:14px;color:var(--text)}
.donor-row .dr-ll{font-size:9.5px;color:var(--text4);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

.fab{position:absolute;right:18px;bottom:96px;width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#2f6bff,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(37,99,235,.42);z-index:6;letter-spacing:.02em}
.fab.add{background:linear-gradient(145deg,#2f6bff,#1d4ed8);font-size:26px;font-weight:400}
body.android .fab{border-radius:18px}

.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;letter-spacing:.01em}
.pill.g{background:var(--green-l);color:var(--green)} .pill.a{background:var(--amber-l);color:var(--amber)}
.pill.b{background:var(--blue-pale);color:var(--blue-2)} .pill.r{background:var(--rose-l);color:var(--rose)}
.pill.s{background:var(--surface2);color:var(--text3)}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;border:1px solid var(--border);color:var(--text2);background:#fff}
.chip.on{background:var(--blue-pale);border-color:var(--blue-mid);color:var(--blue-2)}

.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:14px;font-weight:600;font-size:15.5px;border:0;width:100%;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.28)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
body.android .btn{border-radius:26px;text-transform:none;font-weight:700;letter-spacing:.01em}

.sectlabel{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}

/* section header inside body */
.pad{padding:0 20px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
.kpi .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--text3);text-transform:uppercase}
.kpi .val{font-size:26px;font-weight:400;margin-top:6px;color:var(--text)}
.kpi .d{font-size:12px;margin-top:3px}
.up{color:var(--green);font-weight:600}.dn{color:var(--rose);font-weight:600}.mut{color:var(--text3)}

/* Donor 360 intelligence */
.d360-hero{background:linear-gradient(160deg,#13294a,#0d1b31);padding:16px 20px 18px;color:#fff;position:relative}
.d360-hero .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.d360-hero .back{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;font-size:18px}
.d360-hero .pfp{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#7c3aed,#5b21b6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.d360-hero .nm{font-size:18px;font-weight:700;letter-spacing:-.01em}
.d360-hero .rl{font-size:12px;color:#9fb2cd;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
.tile{background:rgba(255,255,255,.02);padding:11px 4px;text-align:center}
.tile .v{font-size:19px;font-weight:700}
.tile .l{font-size:8.5px;font-weight:700;letter-spacing:.06em;color:#8ba0bd;margin-top:2px}
.d360-tabs{display:flex;gap:20px;padding:12px 20px 0;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:3}
.d360-tabs .t{font-size:14px;font-weight:600;color:var(--text3);padding-bottom:11px;position:relative}
.d360-tabs .t.on{color:var(--blue)}
.d360-tabs .t.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--blue);border-radius:2px}

.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.brandtag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--blue-pale);color:var(--blue-2)}
.range-big{text-align:center;padding:6px 0 2px}
.range-big .n{font-size:34px}
.range-big .s{font-size:12px;color:var(--text3);margin-top:2px}
.rangebar{height:8px;border-radius:6px;background:var(--surface2);margin:14px 16px 6px;position:relative;overflow:hidden}
.rangebar>i{position:absolute;left:25%;width:26%;top:0;bottom:0;background:linear-gradient(90deg,#f0b429,#d97706);border-radius:6px}
.rangeticks{display:flex;justify-content:space-between;padding:0 16px 12px;font-size:10px;color:var(--text4);font-weight:600}
.dl{display:flex;justify-content:space-between;padding:9px 16px;font-size:13px;border-top:1px solid var(--border2)}
.dl .k{color:var(--text3)} .dl .v{font-weight:600}

.guru{background:linear-gradient(160deg,#13294a,#0c1930);border-radius:18px;padding:16px;color:#fff;box-shadow:var(--shadow-md)}
.guru .gh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.guru .gh .l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#c4b5fd}
.guru .gh .icon{width:24px;height:24px;border-radius:8px;background:linear-gradient(145deg,#7c3aed,#5b21b6);display:flex;align-items:center;justify-content:center}
.guru .gh .u{font-size:11px;color:#8ba0bd}
.ask{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 13px;margin-bottom:9px}
.ask .k{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#8ba0bd}
.ask .v{font-size:15px;font-weight:700;margin-top:3px}
.ask .d{font-size:11.5px;color:#c9d4e6;margin-top:4px;line-height:1.4}
.prop{background:linear-gradient(90deg,#3b2e63,#2a2450);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:9px}
.prop .badge{background:#c4b5fd;color:#2a1a5e;font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px}
.prop .t{font-size:12.5px;color:#e6e0fb;font-weight:600}

.score-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.score-row .lab{flex:0 0 128px;font-size:13px;color:var(--text2)}
.score-row .bar{flex:1;height:7px;border-radius:5px;background:var(--surface2);overflow:hidden}
.score-row .bar>i{display:block;height:100%;border-radius:5px}
.score-row .num{flex:0 0 30px;text-align:right;font-weight:700;font-size:13px}

/* design-system gallery */
.ds{padding:20px;display:flex;flex-direction:column;gap:22px;background:var(--surface)}
.ds h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:7px;color:#fff;font-size:10px;font-weight:600;box-shadow:var(--shadow-sm)}
.typescale>div{margin-bottom:6px;color:var(--text)}
.stack{display:flex;flex-direction:column;gap:10px}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{height:46px;border:1px solid var(--border);border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;color:var(--text4);font-size:14px}
.switch{width:46px;height:28px;border-radius:16px;background:var(--blue);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;right:3px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.off{background:#cbd5e1}.switch.off::after{right:auto;left:3px}
.card-lite{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow-sm)}
.notice{color:#93a4bd;font-size:12.5px;text-align:center;margin-top:34px;line-height:1.7}
.legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:14px;color:#8ea0ba;font-size:12px}
.legend b{color:#cdd8e8}

/* ===== Phase 1: auth / onboarding / states ===== */
.auth{padding:6px 26px 30px;display:flex;flex-direction:column;min-height:100%}
.auth-logo{padding:14px 0 22px;display:flex;align-items:center;gap:10px}
.auth-logo .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#13294a,#0b1626);display:flex;align-items:center;justify-content:center}
.auth-logo .nm{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy)}
.h-title{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
body.android .h-title{font-size:23px}
.h-sub{font-size:14px;color:var(--text3);margin-top:7px;line-height:1.5}
.field{margin-top:16px}
.field .lab{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.field .box{height:52px;border:1px solid var(--border);border-radius:14px;background:#fff;display:flex;align-items:center;padding:0 15px;gap:10px;font-size:15px;box-shadow:var(--shadow-sm)}
.field .box.focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-pale)}
.field .box .ph{color:var(--text4)} .field .box .val{color:var(--text);font-weight:500}
.field .box .ic{color:var(--text4);flex:0 0 auto} .field .box .eye{margin-left:auto;color:var(--text4);font-size:12px;font-weight:600}
body.android .field .box{border-radius:10px}
.divider{display:flex;align-items:center;gap:12px;color:var(--text4);font-size:12px;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.sso{height:52px;border-radius:14px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px;color:var(--text);box-shadow:var(--shadow-sm)}
body.android .sso{border-radius:26px}
.sso .gc{width:24px;height:24px;border-radius:7px;background:linear-gradient(145deg,#1f8fff,#0a63d6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.faceid-row{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--blue);font-weight:600;font-size:14.5px;margin-top:16px}
.faceid-row .fi{width:24px;height:24px;border:2px solid var(--blue);border-radius:7px;position:relative}
.link{color:var(--blue);font-weight:600}
.auth-foot{margin-top:auto;text-align:center;color:var(--text3);font-size:13.5px;padding-top:22px}
.otp{display:flex;gap:9px;justify-content:space-between;margin-top:20px}
.otp .c{flex:1;height:58px;border:1.5px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:#fff;color:var(--text)}
.otp .c.f{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-pale)}

.splash{height:100%;background:linear-gradient(165deg,#13294a,#0a1526);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;position:relative;cursor:pointer}
.splash .sub{font-size:12px;letter-spacing:.22em;color:#8ba0bd;text-transform:uppercase}
.splash .hint{position:absolute;bottom:110px;color:#6f83a1;font-size:12px}
.splash .load{position:absolute;bottom:76px;width:120px;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.splash .load i{position:absolute;left:-40%;top:0;bottom:0;width:40%;background:var(--gold);border-radius:3px;animation:load 1.4s infinite}
@keyframes load{0%{left:-40%}100%{left:120%}}

.ob{height:100%;display:flex;flex-direction:column;padding:0 26px 26px}
.ob-skip{display:flex;justify-content:flex-end;padding:14px 0 4px;color:var(--text3);font-weight:600;font-size:14px}
.ob-art{flex:1;border-radius:26px;background:linear-gradient(160deg,#13294a,#0c1930);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:20px;overflow:hidden;padding:24px}
.ob-title{font-size:25px;font-weight:700;letter-spacing:-.02em}
.ob-sub{font-size:15px;color:var(--text3);margin-top:8px;line-height:1.55}
.dots{display:flex;gap:7px;margin:18px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--border);transition:.2s}
.dots i.on{width:22px;border-radius:4px;background:var(--blue)}

.perm{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 30px 26px}
.perm .ill{width:118px;height:118px;border-radius:32px;background:var(--blue-pale);display:flex;align-items:center;justify-content:center;margin-bottom:26px;color:var(--blue)}

/* ===== standalone full-screen app shell ===== */
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0e1a2e;overscroll-behavior:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);max-width:480px;margin:0 auto;position:relative}
#safe-top{flex:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff}
#appbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
#appbody::-webkit-scrollbar{width:0;height:0}
#tabbar{position:relative;z-index:5}
.tabbar{height:auto!important;min-height:60px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))!important}
.fab{position:fixed;right:calc(50% - 240px + 18px);left:auto;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:20}
@media (max-width:480px){.fab{right:18px}}
.sinp{border:0;background:transparent;outline:none;font-size:15px;flex:1;min-width:0;padding:0;color:var(--text);font-family:inherit}
.sinp::placeholder{color:var(--text4)}
.d360-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px}
.d360-nav .nbtn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.d360-nav .ntitle{color:#fff;font-weight:600;font-size:15px;opacity:.92}
.d360-id{display:flex;align-items:center;gap:12px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app">
  <div id="safe-top"></div>
  <div id="appbody"></div>
  <div id="tabbar" class="tabbar"></div>
</div>

<script>
/* ---------- chrome ---------- */
function statusbar(dark){
  const cls = dark ? 'statusbar on-dark' : 'statusbar';
  document.getElementById('statusbar').className = cls;
  const dot = dark ? '#fff' : '#0f172a';
  return `<span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="${dot}"/><rect x="4.5" y="5" width="3" height="7" rx="1" fill="${dot}"/><rect x="9" y="2.5" width="3" height="9.5" rx="1" fill="${dot}"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="${dot}" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1l-1.4 1.4C12.1 5.2 10.4 4.5 8.5 4.5S4.9 5.2 3.6 6.5L2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="${dot}"/><path d="M8.5 6.2c1.2 0 2.3.5 3.1 1.3l-3.1 3.1-3.1-3.1C6.2 6.7 7.3 6.2 8.5 6.2Z" fill="${dot}"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="${dot}" stroke-opacity=".4"/><rect x="3" y="3" width="15" height="7" rx="1.5" fill="${dot}"/><rect x="23.5" y="4" width="1.8" height="5" rx="1" fill="${dot}" opacity=".5"/></svg>
    </span>`;
}
function tabbar(active){
  const items=[['home','Home'],['donors','Donors'],['pipeline','Pipeline'],['tasks','Tasks'],['more','More']];
  const ic={
    home:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>',
    donors:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>',
    pipeline:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>',
    tasks:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
    more:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'
  };
  return items.map(([k,l])=>`<div class="tab ${k===active?'on':''}" onclick="go('${k}')"><div class="ic">${ic[k]}</div><span>${l}</span></div>`).join('');
}

/* ---------- Donor 360 shared chrome ---------- */
function d360hero(tiles){
  var d=currentDonor;
  return `<div class="d360-hero">
    <div class="d360-nav"><div class="nbtn" onclick="go('donors')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div><div class="ntitle">Donor 360</div><div style="width:36px"></div></div>
    <div class="d360-sep"></div>
    <div class="d360-id">${av(d,'lg')}<div style="flex:1"><div class="nm">${d.name}</div><div class="rl">${d.parish} · ${d.tag} donor · Donor since ${d.since}</div></div></div>
    <div class="tiles">${tiles}</div>
  </div>
  <div class="d360-actbar">
    <div class="act" onclick="go('call')"><div class="ai" style="background:var(--green-l);color:var(--green)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h3l1.6 5-2 1.4a11 11 0 005 5l1.4-2 5 1.6v3a2 2 0 01-2 2A16 16 0 014 6a2 2 0 012-3Z"/></svg></div><span>Call</span></div>
    <div class="act" onclick="go('logact')"><div class="ai" style="background:var(--blue-pale);color:var(--blue)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div><span>Log activity</span></div>
    <div class="act" onclick="go('addtask')"><div class="ai" style="background:#F3E8FF;color:var(--purp)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4M12 12.5v5M9.5 15h5"/></svg></div><span>Add task</span></div>
  </div>`;
}
function d360tabs(a){
  const t=[['Overview','d360'],['Activity','d360act'],['Intelligence','intel'],['Contact','d360con']];

  const nrow=e.target.closest('.nrow'); if(nrow && !nrow.getAttribute('onclick')){ toast('Marked as read'); return; }
  const srow=e.target.closest('.set-row'); if(srow && !srow.querySelector('.switch')){ var lb=srow.querySelector('.sl'); var lab=lb?lb.textContent.trim():'Setting'; toast(/sync now/i.test(lab)?'Synced just now ✓':(lab+' updated')); return; }
  const sc=e.target.closest('.sched .s'); if(sc){ toast('Opening pre-meeting brief…'); return; }
  const cc=e.target.closest('.ccard'); if(cc){ var nm=cc.querySelector('div'); toast('Opening '+(nm?nm.textContent.trim():'campaign')); return; }
  const sug=e.target.closest('.sug'); if(sug){ toast('Guru is searching your database…'); return; }
  const arow=e.target.closest('.a'); if(arow && !arow.getAttribute('onclick')){ go('tasks'); return; }
  const orow=e.target.closest('.row'); if(orow && !orow.getAttribute('onclick')){ toast('Opening details…'); return; }
  const tt=e.target.closest('[data-toast]'); if(tt){ toast(tt.getAttribute('data-toast')); }
});
render();
</script>
