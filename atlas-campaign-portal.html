<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiveCentral Atlas — Campaign Overview Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#0E1E35;--navy-2:#152844;--blue:#2563EB;--blue-light:#DBEAFE;--blue-pale:#EFF6FF;
    --teal:#0D9488;--teal-light:#CCFBF1;--green:#15803D;--green-2:#22C55E;--green-light:#DCFCE7;
    --amber:#D97706;--amber-2:#F59E0B;--amber-light:#FEF3C7;--rose:#BE185D;--rose-light:#FCE7F3;
    --purple:#7C3AED;--purple-light:#EDE9FE;--gold:#C8A04A;
    --text:#0F172A;--text-2:#334155;--text-3:#64748B;--border:#E2E8F0;--border-soft:#EDF2F7;--surface:#F8FAFC;
  }
  html{font-size:14px;-webkit-font-smoothing:antialiased}
  body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden}
  a{color:inherit;text-decoration:none}

  /* Sidebar */
  .sidebar{width:220px;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden}
  .sidebar-logo{padding:18px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
  .logo-mark{width:46px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .logo-name{font-family:'DM Serif Display',serif;font-size:19px;color:#fff;line-height:1}
  .logo-sub{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-top:2px}
  .sidebar-scroll{flex:1 1 auto;overflow-y:auto;min-height:0;padding-top:6px}
  .nav-group{padding:8px 8px 0}
  .nav-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:0 10px;margin-bottom:4px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:12px;font-weight:500;color:rgba(255,255,255,.55);cursor:pointer;margin-bottom:1px}
  .nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
  .nav-item.active{background:var(--blue);color:#fff}
  .nav-item svg{width:14px;height:14px;flex-shrink:0}
  .nav-badge{margin-left:auto;background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);border-radius:10px;padding:1px 7px;font-size:10px;font-weight:600}
  .nav-badge.alert{background:var(--rose);color:#fff}
  .sidebar-user{padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:9px;flex-shrink:0}
  .user-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
  .user-name{font-size:12px;font-weight:500;color:rgba(255,255,255,.78)}
  .user-role{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:30}
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);min-width:0}
  .crumb .sep{color:#CBD5E1}
  .crumb .cur{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  /* Role switcher */
  .role-switch{position:relative}
  .rs-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:5px 9px;cursor:pointer;font-family:'DM Sans',sans-serif}
  .rs-btn:hover{border-color:#94A3B8}
  .rs-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
  .rs-meta{text-align:left;line-height:1.15}
  .rs-meta b{font-size:12px;font-weight:600;color:var(--text);display:block}
  .rs-meta small{font-size:10.5px;color:var(--text-3)}
  .rs-btn>svg{width:11px;height:11px;color:var(--text-3)}
  .rs-menu{position:absolute;right:0;top:44px;width:268px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(15,23,42,.18);padding:6px;z-index:50;display:none}
  .rs-menu.show{display:block}
  .rs-mlabel{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px}
  .rs-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
  .rs-opt:hover{background:var(--surface)}
  .rs-opt.on{background:var(--blue-pale)}
  .rs-opt .rs-av{width:30px;height:30px;font-size:11px}
  .rs-opt .nm{font-size:13px;font-weight:600;color:var(--text)}
  .rs-opt .ds{font-size:11px;color:var(--text-3);margin-top:1px}

  /* shared buttons */
  .btn{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap}
  .btn svg{width:13px;height:13px}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1D4ED8}
  .btn-ghost{background:#fff;border-color:var(--border);color:var(--text-2)}.btn-ghost:hover{border-color:#94A3B8;background:var(--surface)}
  .btn-dark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
  .btn-dark:hover{background:rgba(255,255,255,.18)}

  .scroll{overflow-y:auto;flex:1}

  /* ════ HERO (navy) ════ */
  .hero{background:linear-gradient(135deg,#16294C 0%,#1E3D6E 55%,#264C8C 100%);color:#fff;padding:22px 30px 26px;position:relative;overflow:hidden;box-shadow:inset 1px 0 0 rgba(255,255,255,.06)}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:340px;height:340px;background:radial-gradient(circle,rgba(200,160,74,.10),transparent 70%);pointer-events:none}
  .hero-top{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
  .hero-left{flex:1 1 380px;min-width:0}
  .hero-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(34,197,94,.16);color:#86EFAC;border:1px solid rgba(34,197,94,.3);border-radius:99px;padding:2px 10px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:none}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:#22C55E}
  .hero-title{font-family:'DM Serif Display',serif;font-size:32px;line-height:1.1;margin:10px 0 8px}
  .hero-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:rgba(255,255,255,.6)}
  .hero-meta span{display:inline-flex;align-items:center;gap:7px}
  .hero-meta svg{width:13px;height:13px;color:rgba(255,255,255,.4)}
  .hero-desc{font-size:13px;color:rgba(255,255,255,.62);line-height:1.55;max-width:600px;margin-top:14px}
  .hero-scope{display:inline-flex;align-items:center;gap:7px;margin-top:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-size:12px;color:#fff}
  .hero-scope svg{width:13px;height:13px;color:var(--gold)}

  /* hero stat cards */
  .hero-stats{display:flex;gap:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:13px;overflow:hidden;flex-shrink:0;flex-wrap:wrap}
  .hstat{padding:14px 20px;border-right:1px solid rgba(255,255,255,.09);min-width:118px;text-align:left}
  .hstat:last-child{border-right:none}
  .hstat .v{font-family:'DM Serif Display',serif;font-size:24px;line-height:1}
  .hstat .l{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-top:6px}
  .hstat .v.gold{color:#E5C06B}.hstat .v.green{color:#4ADE80}.hstat .v.rose{color:#FB7DAE}.hstat .v.white{color:#fff}

  /* hero progress */
  .hero-prog{margin-top:22px}
  .hp-head{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:7px}
  .hp-head b{color:#fff}
  .hp-pct{font-size:12.5px}
  .hp-pct .a{color:#4ADE80;font-weight:700}.hp-pct .b{color:#E5C06B;font-weight:700}
  .hp-bar{height:11px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;overflow:visible;display:flex}
  .hp-seg{height:100%}
  .hp-seg.cash{background:linear-gradient(90deg,#15803D,#22C55E);border-radius:99px 0 0 99px}
  .hp-seg.pledge{background:linear-gradient(90deg,#B98A2E,#D9A943)}
  .hp-pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.85);border-radius:2px}
  .hp-pace::after{content:"Calendar pace ("attr(data-pace)")";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9.5px;color:rgba(255,255,255,.55);white-space:nowrap}
  .hp-legend{display:flex;gap:18px;margin-top:11px;font-size:11.5px;color:rgba(255,255,255,.6)}
  .hp-legend span{display:inline-flex;align-items:center;gap:7px}
  .hp-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

  /* ════ BODY ════ */
  .body{padding:18px 22px 40px}
  /* KPI strip */
  .kstrip{display:grid;gap:12px;margin-bottom:16px;grid-template-columns:repeat(5,1fr)}
  .kstrip.c5{grid-template-columns:repeat(5,1fr)}
  .kstrip.c6{grid-template-columns:repeat(6,1fr)}
  .kcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px 15px}
  .kcard .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);display:flex;align-items:center;gap:6px}
  .kcard .l svg{width:13px;height:13px;color:var(--text-3)}
  .kcard .v{font-family:'DM Serif Display',serif;font-size:23px;line-height:1;margin:9px 0 4px}
  .kcard .v.amber{color:var(--amber)}.kcard .v.rose{color:var(--rose)}.kcard .v.green{color:var(--green)}
  .kcard .m{font-size:11px;color:var(--text-3)}
  .kcard .m .up{color:var(--green);font-weight:600}

  /* lens switcher */
  .lensbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .lens{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:10px;padding:3px}
  .lens button{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--text-2);background:transparent;border:none;border-radius:7px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .lens button svg{width:13px;height:13px}
  .lens button.on{background:var(--navy);color:#fff}
  .lens-note{font-size:11.5px;color:var(--text-3)}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 312px;gap:16px;align-items:start}
  @media(max-width:1180px){.grid{grid-template-columns:1fr}.kstrip.c5,.kstrip.c6{grid-template-columns:repeat(3,1fr)}.hero-stats{width:100%}.pcards{grid-template-columns:1fr}}
  @media(max-width:680px){.kstrip.c5,.kstrip.c6{grid-template-columns:repeat(2,1fr)}.hstat{flex:1 0 33%}
    .toolbar{flex-wrap:wrap}.search{flex:1 1 100%}.tool-right{width:100%}}

  .card{background:#fff;border:1px solid var(--border);border-radius:13px;overflow:hidden}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--border)}
  .card-head .t{font-size:14px;font-weight:700;color:var(--text)}
  .card-head .s{font-size:12px;color:var(--text-3);margin-top:2px}
  .card-head .ct{margin-left:auto;font-size:11.5px;color:var(--text-3);font-weight:600}
  .card-head.row{display:flex;align-items:center;gap:10px}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .search{flex:0 0 230px;position:relative}
  .search input{width:100%;font-family:'DM Sans',sans-serif;font-size:12.5px;border:1px solid var(--border);border-radius:8px;padding:8px 10px 8px 30px;background:var(--surface);color:var(--text)}
  .search input:focus{outline:none;border-color:var(--blue);background:#fff}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-3)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .chip{font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text-2);border-radius:99px;padding:6px 13px;cursor:pointer}
  .chip:hover{border-color:#94A3B8}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tool-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;color:var(--text-2);background:#fff;border:none;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .seg button svg{width:12px;height:12px}
  .seg button.on{background:var(--surface);color:var(--text)}
  .seg button+button{border-left:1px solid var(--border)}

  /* table */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}
  th.r{text-align:right}
  td{padding:11px 16px;border-bottom:1px solid var(--border-soft);font-size:13px;color:var(--text-2);vertical-align:middle;white-space:nowrap}
  #donor-table,#parish-body{overflow-x:auto}
  .dpager{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3)}
  .dpager b{color:var(--text)}
  .dpg-nav{display:flex;gap:4px;align-items:center}
  .dpg-nav button{min-width:28px;height:28px;padding:0 6px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-2)}
  .dpg-nav button:hover:not(:disabled){border-color:#94A3B8;background:var(--surface)}
  .dpg-nav button.cur{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .dpg-nav button:disabled{opacity:.4;cursor:default}
  .dpg-nav .gap{color:var(--text-3);padding:0 2px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--blue-pale)}
  tr:last-child td{border-bottom:none}
  td.r{text-align:right;font-variant-numeric:tabular-nums}
  .av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
  .donor-cell{display:flex;align-items:center;gap:11px}
  .donor-cell{min-width:0}
  .donor-cell .nm{font-weight:600;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .donor-cell .su{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .paid{color:var(--green);font-weight:600}
  .bal{font-weight:700;color:var(--text)}
  .mut{color:var(--text-3)}
  /* progress mini */
  .pmini{display:flex;align-items:center;gap:9px;min-width:130px}
  .pmini .track{flex:1;height:6px;border-radius:99px;background:#E2E8F0;overflow:hidden}
  .pmini .fill{height:100%;border-radius:99px}
  .pmini .pct{font-size:12px;font-weight:600;width:34px;text-align:right;font-variant-numeric:tabular-nums}
  /* status badge */
  .sb{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px}
  .sb .d{width:6px;height:6px;border-radius:50%}
  .sb.current{background:var(--green-light);color:var(--green)} .sb.current .d{background:var(--green)}
  .sb.overdue{background:var(--rose-light);color:var(--rose)} .sb.overdue .d{background:var(--rose)}
  .sb.behind{background:var(--amber-light);color:var(--amber)} .sb.behind .d{background:var(--amber)}
  .sb.fulfilled{background:var(--blue-light);color:#1D4ED8} .sb.fulfilled .d{background:var(--blue)}
  .sb.atrisk{background:var(--amber-light);color:var(--amber)} .sb.atrisk .d{background:var(--amber)}
  .sb.onpace{background:var(--green-light);color:var(--green)} .sb.onpace .d{background:var(--green)}
  .sb.goalmet{background:var(--blue-light);color:#1D4ED8} .sb.goalmet .d{background:var(--blue)}
  .next-amt{font-weight:600;color:var(--text)}.next-amt.over{color:var(--rose)}
  .next-date{font-size:11px;color:var(--text-3)}
  .ahead{color:var(--green);font-weight:600}.behindp{color:var(--rose);font-weight:600}
  .open-due{font-size:11px;color:var(--rose);font-weight:600}
  .rank{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface);color:var(--text-2)}
  .rank.g1{background:#FEF3C7;color:#B45309}.rank.g2{background:#E2E8F0;color:#475569}.rank.g3{background:#FCE7F3;color:#BE185D}
  .empty{padding:34px 16px;text-align:center;color:var(--text-3);font-size:13px}
  .pdrill{font-size:11px;color:var(--blue);font-weight:600;margin-top:2px}

  /* parish cards view */
  .pcards{padding:14px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .pc{border:1px solid var(--border);border-radius:11px;padding:14px;cursor:pointer}
  .pc:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(37,99,235,.08)}
  .pc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .pc-name{font-weight:700;color:var(--text);font-size:13.5px}
  .pc-loc{font-size:11px;color:var(--text-3)}
  .pc-fig{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--text-3);margin-bottom:6px}
  .pc-fig b{font-size:15px;color:var(--text);font-family:'DM Serif Display',serif}

  /* right rail */
  .rail{display:flex;flex-direction:column;gap:14px}
  .rc{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px 16px}
  .rc-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
  .pace-big{font-family:'DM Serif Display',serif;font-size:34px;color:var(--green);line-height:1}
  .pace-tag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--green-light);color:var(--green);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .pace-tag.warn{background:var(--amber-light);color:var(--amber)}
  .pace-bar{height:7px;border-radius:99px;background:#E2E8F0;overflow:hidden;margin:12px 0 9px}
  .pace-bar .f{height:100%;background:var(--blue);border-radius:99px}
  .rc-note{font-size:12px;color:var(--text-3);line-height:1.5}
  .seg-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px}
  .seg-row+.seg-row{border-top:1px solid var(--border-soft)}
  .seg-row i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .seg-row .nm{color:var(--text-2);font-weight:500}
  .seg-row .ct{margin-left:auto;font-weight:700;color:var(--text)}
  .seg-row .am{font-size:11px;color:var(--text-3);margin-left:6px}
  .dist-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px}
  .dist-row .nm{width:64px;color:var(--text-2)}
  .dist-row .track{flex:1;height:7px;border-radius:99px;background:#E2E8F0;overflow:hidden}
  .dist-row .track .f{height:100%;border-radius:99px}
  .dist-row .ct{width:18px;text-align:right;font-weight:700;color:var(--text)}
  .top-row{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:12.5px}
  .top-row+.top-row{border-top:1px solid var(--border-soft)}

/* ════════════════ HELPERS ════════════════ */
function money(n){ if(n>=1000000) return "$"+(n/1000000).toFixed(2).replace(/\.00$/,"")+"M"; if(n>=1000) return "$"+Math.round(n/1000)+"K"; return "$"+n.toLocaleString(); }
function full(n){ return "$"+n.toLocaleString(); }
function initials(name){ const c=name.replace(/,/g,"").split(/[\s&]+/).filter(Boolean); return ((c[0]||"")[0]||"")+((c[1]||"")[0]||""); }
function pct(d){ return d.pledged? Math.round(d.paid/d.pledged*100):0; }
function progColor(p){ return p>=100?"var(--blue)":p>=66?"var(--green-2)":p>=50?"var(--green-2)":p>=40?"var(--amber-2)":"var(--rose)"; }
function statusLabel(s){ return {current:"Current",overdue:"Overdue",behind:"Behind",fulfilled:"Fulfilled",onpace:"On pace",atrisk:"At risk",behindp:"Behind"}[s]||s; }

function visibleDonors(){
  let rows = DONORS.slice();
  if(role.scope!=="all") rows = rows.filter(d=>d.officer===role.scope);
  return rows;
}

/* ════════════════ SHARE LIVE LINK ════════════════ */
let shareState=null;
function slug(s){ return (s||'campaign').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28); }
function newToken(){ return Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6); }
function shareUrl(){ return 'https://atlas.givecentral.org/r/'+slug(CAMPAIGN&&CAMPAIGN.name)+'/'+shareState.token; }
/* Local URL that actually renders the public shared view in this prototype */
function liveViewUrl(){ return 'atlas-campaign-portal.html?share=1&donors='+(shareState.donors?1:0)+'&by='+encodeURIComponent('Patricia Reyes')+'&t='+shareState.token; }
function openLiveView(){ if(shareState.revoked){ toast('Link revoked — generate a new one first'); return; } window.open(liveViewUrl(),'_blank'); }
function openShare(){
  if(!shareState) shareState={ token:newToken(), scope:'anyone', expiry:'end', donors:false, revoked:false };
  renderShare();
  document.getElementById("share").classList.add("show");
  document.getElementById("share-scrim").classList.add("show");
}
function closeShare(){ document.getElementById("share").classList.remove("show"); document.getElementById("share-scrim").classList.remove("show"); }
function renderShare(){
  const s=shareState, revoked=s.revoked;
  const url = revoked ? '— link revoked —' : shareUrl();
  document.getElementById("share").innerHTML =
    '<div class="rm-h"><span class="ic"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="3.5" cy="7" r="1.8"/><circle cx="10.5" cy="3.5" r="1.8"/><circle cx="10.5" cy="10.5" r="1.8"/><path d="M5.2 6.1l3.6-1.8M5.2 7.9l3.6 1.8"/></svg></span>'
      + '<div><div class="t">Share live link</div><div class="s">'+(CAMPAIGN?CAMPAIGN.name:'Campaign')+' · read-only report</div></div></div>'
    + '<div class="rm-b">'
      + '<div class="sh-linkbox"><input id="sh-url" readonly value="'+url+'">'
        + '<button class="sh-copy" id="sh-copy" onclick="copyShare()"'+(revoked?' disabled style="opacity:.5;cursor:default"':'')+'><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.3"/><path d="M2 8V2.2A.7.7 0 0 1 2.7 1.5H8"/></svg>Copy</button></div>'
      + '<div class="sh-meta">Recipients open this in a browser — no Atlas login needed. <a onclick="openLiveView()">Open live view ↗</a> · <a onclick="regenShare()">Generate new link</a></div>'
      + '<div class="sh-access"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7s2.5-4.5 6-4.5 6 4.5 6 4.5-2.5 4.5-6 4.5S1 7 1 7z"/><circle cx="7" cy="7" r="1.7"/></svg><span><b>Anyone with the link can view</b> — read-only, no Atlas login or account needed.</span></div>'
      + '<div class="sh-opt"><label>Link expires</label><select id="sh-exp" onchange="shareState.expiry=this.value">'
        + '<option value="end"'+(s.expiry==='end'?' selected':'')+'>When the campaign ends (Dec 31, 2026)</option>'
        + '<option value="30"'+(s.expiry==='30'?' selected':'')+'>In 30 days</option>'
        + '<option value="90"'+(s.expiry==='90'?' selected':'')+'>In 90 days</option>'
        + '<option value="never"'+(s.expiry==='never'?' selected':'')+'>Never</option>'
      + '</select></div>'
      + '<div class="sh-toggle'+(s.donors?' on':'')+'" onclick="toggleDonors()"><span class="sw"></span>'
        + '<div><div class="tt">Show donor-level detail</div><div class="ts">Off by default — recipients see parish rollups only, not individual donor names or amounts.</div></div></div>'
      + (s.donors ? '<div class="sh-warn"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2l5.5 9.5H1.5z"/><path d="M7 6v2.5M7 10v.3"/></svg><span><b>Anyone with this link will see individual donor names, amounts, and gift officers.</b> Only share it with trusted staff — never post it publicly.</span></div>' : '')
      + '<div class="sh-live"><span class="dot"></span>Figures refresh automatically — this always shows current cash, pledges, and pace.</div>'
    + '</div>'
    + '<div class="rm-f">'
      + (revoked
          ? '<button class="btn btn-primary" onclick="regenShare()">Create new link</button>'
          : '<button class="btn btn-ghost" onclick="revokeShare()" style="margin-right:auto;color:#BE185D">Revoke link</button>'
            + '<button class="btn btn-ghost" onclick="closeShare()">Done</button>'
            + '<button class="btn btn-primary" onclick="emailShare()"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.5"><rect x="1.5" y="2.5" width="9" height="7" rx="1"/><path d="M1.5 3.5L6 6.5l4.5-3" stroke-linecap="round"/></svg>Email link</button>')
    + '</div>';
}
function copyShare(){
  if(shareState.revoked) return;
  const url=shareUrl(), inp=document.getElementById("sh-url");
  try{ navigator.clipboard.writeText(url); }catch(e){ try{ inp.select(); document.execCommand('copy'); }catch(_){} }
  const b=document.getElementById("sh-copy");
  b.classList.add("done"); b.innerHTML='<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M2 6.5l2.5 2.5 5.5-6"/></svg>Copied';
  setTimeout(function(){ if(b){ b.classList.remove("done"); b.innerHTML='<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.3"/><path d="M2 8V2.2A.7.7 0 0 1 2.7 1.5H8"/></svg>Copy'; } },1600);
  toast("Live link copied to clipboard");
}
function toggleDonors(){
  shareState.donors=!shareState.donors;
  renderShare();
  toast(shareState.donors
    ? 'Donor-level detail ON — recipients will see individual donor names & amounts'
    : 'Donor-level detail off — parish rollups only');
}
function regenShare(){ shareState.token=newToken(); shareState.revoked=false; renderShare(); toast("New link generated — the old one no longer works"); }
function revokeShare(){ shareState.revoked=true; renderShare(); toast("Link revoked — it will no longer open"); }
function shareMailto(){
  var name = CAMPAIGN ? CAMPAIGN.name : 'Campaign';
  var url  = shareUrl();
  var subject = name + ' — live campaign report';
  var body =
    'Hi,\n\n' +
    'Here is the live report for ' + name + '. It opens in any browser — no login needed — and always shows the current figures (cash received, pledges, and pace).\n\n' +
    url + '\n\n' +
    (shareState.donors ? 'This view includes donor-level detail.\n\n' : 'This view shows parish rollups only.\n\n') +
    'Best,\nPatricia Reyes';
  return 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}
function emailShare(){
  if(shareState.revoked){ toast('Link revoked — generate a new one first'); return; }
  var mailto = shareMailto();
  try{ window.location.href = mailto; }catch(e){ window.open(mailto); }
  toast('Opening your email app with the link…');
}

/* ════════════════ TOAST ════════════════ */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

/* ════════════════ PUBLIC SHARED-VIEW MODE ════════════════ */
function applyShareMode(){
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=null; }
  if(!q || q.get('share')!=='1') return;
  document.body.classList.add('share-mode');
  var showDonors = q.get('donors')==='1';
  var by = q.get('by');
  var sub = document.getElementById('share-banner-sub');
  if(sub){
    var when = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    sub.textContent = 'Live campaign report · view-only' + (by?(' · shared by '+by):'') + ' · as of '+when;
  }
  if(!showDonors){
    // Hide the By-Donor lens and force the parish rollup — no individual donor names/amounts
    var donorBtn = document.querySelector('#lens button[data-lens="donor"]');
    if(donorBtn) donorBtn.classList.add('hide-donor');
    if(typeof setLens==='function') setLens('parish');
  }
  // Neutralise internal navigation for public viewers (drill-throughs, reminders, breadcrumb links)
  document.addEventListener('click', function(e){
    var a=e.target.closest('a[href], [onclick]');
    if(!a) return;
    var href=a.getAttribute('href')||'';
    var oc=a.getAttribute('onclick')||'';
    if(/atlas-(donor-360|dashboard|campaign-|log-|pledge)/.test(href) || /drillParish|openReminder|openDonor|window\.location/.test(oc)){
      e.preventDefault(); e.stopPropagation();
      if(window.toast) toast('This is a view-only shared report');
    }
  }, true);
}

/* ════════════════ INIT ════════════════ */
renderNav();
applyRole("dev");
applyShareMode();
</script>

  var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var DATE_PH=/\b(m{1,2}\s*[\/\-.]\s*d{1,2}\s*[\/\-.]\s*y{2,4}|y{4}\s*[\/\-.]\s*m{1,2}\s*[\/\-.]\s*d{1,2}|d{1,2}\s*[\/\-.]\s*m{1,2}\s*[\/\-.]\s*y{2,4})\b/i;
  var WORD_DATE=/\bdate\b/i;

  function looksDate(inp){
    if(!inp||inp.tagName!=='INPUT') return false;
    var t=(inp.getAttribute('type')||'text').toLowerCase();
    if(t!=='text'&&t!=='') return false;              // leave native date/other inputs alone
    if(inp.getAttribute('data-adp')==='off') return false;
    if(inp.getAttribute('list')) return false;         // autocomplete fields
    var ph=inp.getAttribute('placeholder')||'';
    if(DATE_PH.test(ph)) return true;
    if(WORD_DATE.test(ph)) return true;
    // label / aria signal (whole word "date")
    var lab=inp.getAttribute('aria-label')||'';
    if(WORD_DATE.test(lab)) return true;
    // native label association (for=/wrapping label)
    try{ if(inp.labels){ for(var i=0;i<inp.labels.length;i++){ if(WORD_DATE.test(inp.labels[i].textContent||'')) return true; } } }catch(e){}
    var isLbl=function(el){ return el && el.matches && el.matches('label,.lbl,.field-label,.form-label'); };
    // immediate preceding sibling labels (no climbing to broad ancestors)
    var sib=inp.previousElementSibling, guard=0;
    while(sib && guard<3){ if(isLbl(sib) && WORD_DATE.test(sib.textContent||'')) return true; sib=sib.previousElementSibling; guard++; }
    // direct label children of the input's own wrapper only
    var par=inp.parentElement;
    if(par){ var kids=par.children; for(var j=0;j<kids.length;j++){ var k=kids[j]; if(k!==inp && isLbl(k) && WORD_DATE.test(k.textContent||'')) return true; } }
    return false;
  }

  // ---- format detection & output ----
  function fmtOf(inp){
    var ph=(inp.getAttribute('placeholder')||'').toLowerCase();
    var v=(inp.value||'').trim();
    if(/y{4}\s*[\/\-.]\s*m/.test(ph)||/^\d{4}-\d{1,2}-\d{1,2}$/.test(v)) return 'iso';
    if(/d{1,2}\s*[\/\-.]\s*m/.test(ph)) return 'dmy';
    if(/[a-z]{3,}\s+\d{1,2},?\s+\d{4}/i.test(v)) return 'long';
    return 'mdy';
  }
  function pad(n){return (n<10?'0':'')+n;}
  function toStr(d,fmt){
    var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
    if(fmt==='iso') return y+'-'+pad(m)+'-'+pad(day);
    if(fmt==='dmy') return pad(day)+'/'+pad(m)+'/'+y;
    if(fmt==='long') return MON[m-1]+' '+day+', '+y;
    return pad(m)+'/'+pad(day)+'/'+y;
  }
  function parse(v){
    v=(v||'').trim(); if(!v) return null;
    var m;
    if(m=v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/)) return new Date(+m[1],+m[2]-1,+m[3]);
    if(m=v.match(/^([a-z]{3,})\s+(\d{1,2}),?\s+(\d{4})$/i)){var mi=MON.findIndex(function(x){return x.toLowerCase().indexOf(m[1].toLowerCase())===0;});if(mi>=0)return new Date(+m[3],mi,+m[2]);}
    if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){var y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2]);}
    var d=new Date(v); return isNaN(d)?null:d;
  }

  // ---- single shared popover ----
  var pop,active,view,mode='days';
  function build(){
    pop=document.createElement('div');pop.className='adp-pop';pop.setAttribute('role','dialog');
    document.body.appendChild(pop);
    pop.addEventListener('mousedown',function(e){e.preventDefault();}); // keep field focus
  }
  function close(){ if(pop) pop.classList.remove('open'); active=null; mode='days'; }
  function open(inp){
    if(!pop) build();
    active=inp; mode='days';
    view=parse(inp.value)||new Date();
    render(); position(); pop.classList.add('open');
  }
  function position(){
    var r=active.getBoundingClientRect(), sx=window.pageXOffset, sy=window.pageYOffset;
    pop.style.visibility='hidden'; pop.classList.add('open');
    var ph=pop.offsetHeight, pw=pop.offsetWidth;
    pop.classList.remove('open'); pop.style.visibility='';
    var top=r.bottom+sy+6, left=r.left+sx;
    if(r.bottom+ph+6>window.innerHeight && r.top-ph-6>0) top=r.top+sy-ph-6;
    left=Math.min(left, sx+window.innerWidth-pw-8); left=Math.max(left,sx+8);
    pop.style.top=top+'px'; pop.style.left=left+'px';
  }
  function commit(d){
    var fmt=fmtOf(active);
    active.value=toStr(d,fmt);
    active.dispatchEvent(new Event('input',{bubbles:true}));
    active.dispatchEvent(new Event('change',{bubbles:true}));
    close();
  }
  function render(){
    if(mode==='months'){renderMonths();return;}
    if(mode==='years'){renderYears();return;}
    var y=view.getFullYear(), mo=view.getMonth();
    var sel=parse(active.value), today=new Date();
    var first=new Date(y,mo,1), start=first.getDay(), dim=new Date(y,mo+1,0).getDate(), pdim=new Date(y,mo,0).getDate();
    var h='<div class="adp-hd"><button class="adp-nav" data-a="pm">&#8249;</button>'+
      '<div class="adp-title" data-a="mode">'+MON[mo]+' '+y+'</div>'+
      '<button class="adp-nav" data-a="nm">&#8250;</button></div><div class="adp-grid">';
    for(var i=0;i<7;i++) h+='<div class="adp-dow">'+DOW[i]+'</div>';
    for(var c=0;c<42;c++){
      var dn,cls='adp-day',dt;
      if(c<start){dn=pdim-start+1+c;cls+=' mut';dt=new Date(y,mo-1,dn);}
      else if(c-start+1<=dim){dn=c-start+1;dt=new Date(y,mo,dn);}
      else{dn=c-start+1-dim;cls+=' mut';dt=new Date(y,mo+1,dn);}
      if(dt.getFullYear()===today.getFullYear()&&dt.getMonth()===today.getMonth()&&dt.getDate()===today.getDate())cls+=' today';
      if(sel&&dt.getFullYear()===sel.getFullYear()&&dt.getMonth()===sel.getMonth()&&dt.getDate()===sel.getDate())cls+=' sel';
      h+='<button class="'+cls+'" data-d="'+dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate()+'">'+dn+'</button>';
      if(c>=start+dim-1 && (c+1)%7===0) break;
    }
    h+='</div><div class="adp-ft"><button class="adp-today-b" data-a="today">Today</button><button class="adp-clear-b" data-a="clear">Clear</button></div>';
    pop.innerHTML=h;
  }
  function renderMonths(){
    var y=view.getFullYear();
    var h='<div class="adp-hd"><button class="adp-nav" data-a="py">&#8249;</button>'+
      '<div class="adp-title" data-a="years">'+y+'</div><button class="adp-nav" data-a="ny">&#8250;</button></div><div class="adp-mgrid">';
    for(var i=0;i<12;i++) h+='<button class="adp-cell'+(i===view.getMonth()?' sel':'')+'" data-m="'+i+'">'+MONS[i]+'</button>';
    h+='</div>'; pop.innerHTML=h;
  }
  function renderYears(){
    var base=view.getFullYear()-6;
    var h='<div class="adp-hd"><button class="adp-nav" data-a="pyr">&#8249;</button>'+
      '<div class="adp-title">'+base+' – '+(base+11)+'</div><button class="adp-nav" data-a="nyr">&#8250;</button></div><div class="adp-mgrid">';
    for(var i=0;i<12;i++){var yr=base+i;h+='<button class="adp-cell'+(yr===view.getFullYear()?' sel':'')+'" data-y="'+yr+'">'+yr+'</button>';}
    h+='</div>'; pop.innerHTML=h;
  }

  document.addEventListener('click',function(e){
    if(!pop) return;
    var t=e.target;
    if(pop.contains(t)){
      var a=t.getAttribute('data-a'), d=t.getAttribute('data-d'), mm=t.getAttribute('data-m'), yy=t.getAttribute('data-y');
      if(d){var p=d.split('-');commit(new Date(+p[0],+p[1]-1,+p[2]));return;}
      if(mm!=null){view=new Date(view.getFullYear(),+mm,1);mode='days';render();return;}
      if(yy!=null){view=new Date(+yy,view.getMonth(),1);mode='months';render();return;}
      if(a==='pm'){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();}
      else if(a==='nm'){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();}
      else if(a==='mode'){mode='months';render();}
      else if(a==='years'){mode='years';render();}
      else if(a==='py'){view=new Date(view.getFullYear()-1,view.getMonth(),1);render();}
      else if(a==='ny'){view=new Date(view.getFullYear()+1,view.getMonth(),1);render();}
      else if(a==='pyr'){view=new Date(view.getFullYear()-12,view.getMonth(),1);render();}
      else if(a==='nyr'){view=new Date(view.getFullYear()+12,view.getMonth(),1);render();}
      else if(a==='today'){commit(new Date());}
      else if(a==='clear'){active.value='';active.dispatchEvent(new Event('input',{bubbles:true}));active.dispatchEvent(new Event('change',{bubbles:true}));close();}
      return;
    }
    if(active && t===active) return;
    close();
  },true);

  document.addEventListener('focusin',function(e){ if(looksDate(e.target)) open(e.target); });
  document.addEventListener('click',function(e){ if(looksDate(e.target) && active!==e.target) open(e.target); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  window.addEventListener('resize',function(){ if(active&&pop&&pop.classList.contains('open')) position(); });
  window.addEventListener('scroll',function(){ if(active&&pop&&pop.classList.contains('open')) position(); },true);

  window.__atlasLooksDate=looksDate; // exposed for tests
})();
</script>
<!-- /ATLAS-DATEPICKER -->
<!-- ATLAS-NAVCOLLAPSE v1 : expandable/collapsible Campaigns submenu (Appeals / Funds) -->
<style id="atlas-navcollapse-css">
.nav-caret{ margin-left:auto; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
  border-radius:5px; opacity:.55; transition:transform .18s ease, opacity .15s, background .15s; flex-shrink:0; }
.nav-caret:hover{ opacity:1; background:rgba(255,255,255,.12); }
.nav-caret svg{ width:9px; height:9px; }
.nav-item.nav-open .nav-caret{ transform:rotate(90deg); }
.nav-item .nav-badge + .nav-caret{ margin-left:8px; }
.nav-subwrap{ overflow:hidden; }
</style>
<script id="atlas-navcollapse-js">
(function(){
  if (window.__atlasNavCollapse) return; window.__atlasNavCollapse = true;
  var CARET = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2l3 3-3 3"/></svg>';

  function setup(link){
    // collect submenu: a following .nav-subwrap, or loose Appeals/Funds nav-items (portal)
    var wrap=null, subs=[], next=link.nextElementSibling;
    if(next && next.classList && next.classList.contains('nav-subwrap')) wrap=next;
    else {
      var n=next;
      while(n && n.classList && n.classList.contains('nav-item') && /atlas-(appeals|funds)\.html$/.test(n.getAttribute('href')||'')){ subs.push(n); n=n.nextElementSibling; }
    }
    if(!wrap && !subs.length) return;

    var childActive = wrap ? !!wrap.querySelector('.nav-item.active') : subs.some(function(s){return s.classList.contains('active');});
    var expanded = link.classList.contains('active') || childActive;

    if(!link.querySelector('.nav-caret')){
      var car=document.createElement('span'); car.className='nav-caret'; car.setAttribute('aria-label','Toggle submenu'); car.innerHTML=CARET;
      link.appendChild(car);
    }
    var caret=link.querySelector('.nav-caret');
    function apply(){
      if(wrap) wrap.style.display = expanded?'':'none';
      else subs.forEach(function(s){ s.style.display = expanded?'':'none'; });
      link.classList.toggle('nav-open', expanded);
      link.setAttribute('aria-expanded', expanded?'true':'false');
    }
    apply();
    caret.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); expanded=!expanded; apply(); });
  }

  function scan(){
    var links=document.querySelectorAll('.nav-item[href="atlas-campaign-dashboard.html"]:not([data-navcol])');
    for(var i=0;i<links.length;i++){ links[i].setAttribute('data-navcol','1'); setup(links[i]); }
  }
  function boot(){
    scan();
    // portal renders its sidebar via JS — watch for it to appear
    var host=document.querySelector('.sidebar, #nav') || document.body;
    try{
      var mo=new MutationObserver(function(){ scan(); });
      mo.observe(host, {childList:true, subtree:true});
      setTimeout(function(){ mo.disconnect(); }, 4000);
    }catch(e){}
    var tries=0, t=setInterval(function(){ scan(); if(++tries>12) clearInterval(t); }, 120);
  }
  if(document.readyState!=='loading') boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
<!-- /ATLAS-NAVCOLLAPSE -->
